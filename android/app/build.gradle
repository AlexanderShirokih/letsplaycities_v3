plugins {
    id "com.android.application"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def hasSigningProps = { List<String> names -> names.every { project.hasProperty(it) } }
def hasTestSigning = hasSigningProps(["store_pass", "store_file", "lps_alias"])
def hasReleaseSigning = hasSigningProps(["store_pass_release", "store_file_release",
                                         "lps_alias_release", "lps_alias_pass_release"])

// Without the release keystore the release build type falls back to the debug key, so that
// `flutter run --release` works locally. Such an artifact is rejected by stores, cannot update
// a store install, and breaks Google, Facebook and VK sign-in bound to the release certificate.
// Warn on every release build: the task declares no outputs, so Gradle never skips it as
// up-to-date. QUIET level, because Flutter runs Gradle with -q.
if (!hasReleaseSigning) {
    def warnDebugSignedRelease = tasks.register("warnDebugSignedRelease") {
        doLast { task ->
            task.logger.quiet("WARNING: release signing properties (store_pass_release, store_file_release, " +
                    "lps_alias_release, lps_alias_pass_release) are missing. " +
                    "This release build is signed with the DEBUG key and must not be distributed.")
        }
    }
    tasks.configureEach { task ->
        if (task.name == "preReleaseBuild") {
            task.dependsOn(warnDebugSignedRelease)
        }
    }
}

android {
    namespace = "ru.aleshi.letsplaycities"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        disable "InvalidPackage"
    }

    defaultConfig {
        applicationId = "ru.aleshi.letsplaycities"
        minSdk = flutter.minSdkVersion
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (hasTestSigning) {
            default_test {
                def testPass = file(project.property("store_pass") as String).text
                storeFile = file(project.property("store_file") as String)
                storePassword = testPass
                keyPassword = testPass
                keyAlias = project.property("lps_alias") as String
            }
        }

        if (hasReleaseSigning) {
            release {
                storeFile = file(project.property("store_file_release") as String)
                storePassword = file(project.property("store_pass_release") as String).text
                keyPassword = project.property("lps_alias_pass_release") as String
                keyAlias = project.property("lps_alias_release") as String
            }
        }
    }

    buildTypes {
        release {
            signingConfig = hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.10.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"

    implementation "com.vk:androidsdk:2.7.0"
    implementation "ru.ok:odnoklassniki-android-sdk:2.1.8"
    implementation "com.facebook.android:facebook-login:9.0.0"

    // Keep the BoM in sync with FirebaseSDKVersion of the firebase_core plugin.
    implementation platform("com.google.firebase:firebase-bom:35.1.0")

    implementation "com.google.android.gms:play-services-auth:19.0.0"
    implementation "com.google.android.gms:play-services-games:21.0.0"
}

flutter {
    source = "../.."
}
