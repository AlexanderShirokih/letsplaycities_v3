name: lets_play_cities
description: Lets Play Cities Game

version: 3.2.0+3201

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter

  shimmer: ^4.0.0
  get_it: ^9.3.0
  dio: ^5.11.1
  meta: ^1.19.0
  crypto: ^3.0.6
  image: ^4.12.0
  intl: ^0.20.3
  rxdart: ^0.28.0
  equatable: ^3.0.0
  package_info_plus: ^10.2.2
  device_info_plus: ^13.3.0
  flutter_bloc: ^9.1.1
  path_provider: ^2.1.6
  avatar_glow: ^3.0.1
  image_picker: ^1.2.4
  web_socket_channel: ^3.0.3
  shared_preferences: ^2.5.6
  flutter_stream_listener: ^2.0.0
  firebase_core: ^5.1.0
  firebase_crashlytics: ^6.0.1
  firebase_messaging: ^17.0.1
  audioplayers: ^6.8.1
  speech_to_text: ^7.5.0
  clock: ^1.1.3
  slang: ^4.19.2
  slang_flutter: ^4.19.0
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

# The following section is specific to Flutter.
flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/flags/
    - assets/sound/
    - assets/data/

  fonts:
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded[wght].ttf
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik[wght].ttf
