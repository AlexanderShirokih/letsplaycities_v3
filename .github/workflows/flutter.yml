name: Flutter CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with the SDK the lockfile was resolved with
  # (pubspec.lock: dart ">=3.13.0", flutter ">=3.47.0").
  FLUTTER_VERSION: '3.47.9'

jobs:
  check:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # lib/i18n/strings*.g.dart are committed; fail when ru.i18n.json changed
      # without regenerating them.
      - name: Check generated strings are up to date
        run: dart run slang && git diff --exit-code lib/i18n

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --test-randomize-ordering-seed random

  build-android:
    name: Build debug APK
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # AGP 9.1 / Gradle 9.3 / JDK 17.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # android/app/google-services.json is committed, so the google-services
      # plugin needs no secrets. Debug builds use the default debug keystore.
      # flutter generates android/local.properties and the Gradle wrapper
      # scripts (both gitignored) before invoking Gradle.
      - name: Build debug APK
        run: flutter build apk --debug
